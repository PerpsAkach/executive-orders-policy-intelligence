[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "executive-order-policy-intelligence"
version = "0.1.0"
description = "Hybrid NLP and policy-taxonomy pipeline for U.S. presidential documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pypdf>=5,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
eo-policy-intelligence = "executive_order_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
